components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }

    User:
      type: object
      required: [id, role, email, name, accountStatus]
      properties:
        id: { type: integer }
        role: { type: string, enum: [doll, member, admin] }
        email: { type: string }
        name: { type: string }
        accountStatus: { type: string, enum: [active, pending, suspended, banned] }
        dollId: { type: ["integer", "null"] }
        createdAt: { type: string }

    MemberProfile:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        profilePhotoUrl: { type: ["string", "null"] }
        memberSince: { type: string }

    CurrentUser:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"

    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }

    DollRegistration:
      type: object
      required:
        - legalName
        - stageName
        - email
        - password
        - city
        - state
        - bio
        - favoriteFlavor
        - experienceLevel
        - ageConfirmed
        - rulesAccepted
      properties:
        legalName: { type: string, minLength: 1 }
        stageName: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        password: { type: string, minLength: 6 }
        phone: { type: string }
        city: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        age: { type: integer }
        bio: { type: string }
        favoriteFlavor: { type: string }
        experienceLevel: { type: string }
        preferences: { type: string }
        profilePhotoUrl: { type: string }
        verificationPhotoUrl: { type: string }
        verificationVideoUrl: { type: string }
        governmentIdUrl: { type: string }
        ageConfirmed: { type: boolean }
        rulesAccepted: { type: boolean }

    MemberRegistration:
      type: object
      required:
        - name
        - email
        - username
        - password
        - ageConfirmed
        - rulesAccepted
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        phone: { type: string }
        city: { type: string }
        state: { type: string }
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 6 }
        profilePhotoUrl: { type: string }
        ageConfirmed: { type: boolean }
        rulesAccepted: { type: boolean }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    Doll:
      type: object
      required:
        - id
        - stageName
        - city
        - state
        - verified
        - featured
        - elite
        - online
        - tier
      properties:
        id: { type: integer }
        stageName: { type: string }
        city: { type: string }
        state: { type: string }
        age: { type: ["integer", "null"] }
        bio: { type: string }
        favoriteFlavor: { type: string }
        experienceLevel: { type: string }
        preferences: { type: string }
        profilePhotoUrl: { type: string }
        verified: { type: boolean }
        featured: { type: boolean }
        elite: { type: boolean }
        online: { type: boolean }
        availableForVideoChat: { type: boolean }
        tier: { type: string, enum: [free, premium, featured, elite] }
        premiumPhotoCount: { type: integer }
        premiumVideoCount: { type: integer }
        freePhotoCount: { type: integer }
        shortVideoCount: { type: integer }
        favoriteCount: { type: integer }
        subscriptionPrice: { type: number }
        messagePrice: { type: number }
        videoChatRate: { type: number }
        createdAt: { type: string }

    DollDetail:
      allOf:
        - $ref: "#/components/schemas/Doll"
        - type: object
          properties:
            verificationStatus: { type: string, enum: [unverified, pending, approved, rejected] }
            isFavorited: { type: boolean }
            viewerSubscribed: { type: boolean }
            media:
              type: array
              items:
                $ref: "#/components/schemas/Media"

    DollProfileUpdate:
      type: object
      properties:
        stageName: { type: string }
        city: { type: string }
        state: { type: string }
        bio: { type: string }
        favoriteFlavor: { type: string }
        experienceLevel: { type: string }
        preferences: { type: string }
        profilePhotoUrl: { type: string }
        online: { type: boolean }
        availableForVideoChat: { type: boolean }
        subscriptionPrice: { type: number }
        messagePrice: { type: number }
        videoChatRate: { type: number }

    DollAnalytics:
      type: object
      required: [profileViews, favorites, contentUnlocks, messageRevenue, videoChatRevenue, subscriptionRevenue]
      properties:
        profileViews: { type: integer }
        favorites: { type: integer }
        contentUnlocks: { type: integer }
        messageRevenue: { type: number }
        videoChatRevenue: { type: number }
        subscriptionRevenue: { type: number }
        totalEarnings: { type: number }
        pendingPayout: { type: number }
        viewsTrend:
          type: array
          items: { $ref: "#/components/schemas/RevenuePoint" }
        earningsTrend:
          type: array
          items: { $ref: "#/components/schemas/RevenuePoint" }

    Media:
      type: object
      required: [id, dollId, type, status, containsHookah, premium]
      properties:
        id: { type: integer }
        dollId: { type: integer }
        type: { type: string, enum: [profile, free_photo, premium_photo, premium_video, short_video, verification] }
        url: { type: string }
        thumbnailUrl: { type: string }
        caption: { type: string }
        status: { type: string, enum: [pending_review, approved, rejected] }
        containsHookah: { type: boolean }
        premium: { type: boolean }
        price: { type: number }
