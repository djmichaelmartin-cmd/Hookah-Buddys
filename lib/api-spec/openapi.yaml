  # ═══════════════════════════════════════════════════════════════════════════
  # Groups — member-created group spaces
  # ═══════════════════════════════════════════════════════════════════════════

  /groups:
    get:
      operationId: listGroups
      tags: [groups]
      summary: Discover/search Groups
      description: >
        By default excludes Meetup groups (groupType="meetup") so the Groups
        discovery page stays distinct from /meetups. Pass groupType=meetup to
        explicitly request only meetup groups, or groupType=all to include both.
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: privacy, in: query, required: false, schema: { type: string, enum: [public, private] } }
        - { name: featured, in: query, required: false, schema: { type: boolean } }
        - name: groupType
          in: query
          required: false
          description: >
            Filter by group type. Omitting or passing "group" returns only regular
            groups (excludes meetups). Pass "meetup" for meetups only. Pass "all"
            to include both.
          schema: { type: string, enum: [group, meetup, all] }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupList"
    post:
      operationId: createGroup
      tags: [groups]
      summary: Create a new Group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"

  /groups/my:
    get:
      operationId: listMyGroups
      tags: [groups]
      summary: Groups the current user belongs to
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupSummary"

  /groups/invites:
    get:
      operationId: listMyGroupInvites
      tags: [groups]
      summary: Pending group invites for the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupInvite"

  /groups/{groupId}:
    get:
      operationId: getGroup
      tags: [groups]
      summary: Get group detail (private-visible non-members get a sanitized preview)
      description: >
        Members and public groups return the full GroupDetail. A non-member of a
        private + VISIBLE group (or a private + hidden group they hold a valid
        non-expired invite to) receives a sanitized preview (isPreview=true) with
        group summary/branding only — posts, members, media, and events stay
        behind their own membership-gated endpoints. Private + hidden groups
        without a valid invite return 403.
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK (full detail, or sanitized preview with isPreview=true)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
        "403":
          description: Private hidden group — not a member and no valid invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      operationId: updateGroup
      tags: [groups]
      summary: Update group settings (owner/admin)
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetail"
    delete:
      operationId: deleteGroup
      tags: [groups]
      summary: Delete group (owner only; soft-deletes)
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /groups/{groupId}/join:
    post:
      operationId: joinGroup
      tags: [groups]
      summary: Join a public group or request to join a private group
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGroupBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupJoinResult"

  /groups/{groupId}/leave:
    post:
      operationId: leaveGroup
      tags: [groups]
      summary: Leave a group (cannot leave if owner)
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /groups/{groupId}/members:
    get:
      operationId: listGroupMembers
      tags: [groups]
      summary: List group members (private group requires membership)
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: integer } }
        - { name: role, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupMember"

  /groups/{groupId}/members/{userId}:
    patch:
      operationId: updateGroupMember
      tags: [groups]
      summary: Update a member's role or status (admin/owner)
      parameters:
        - { name: groupId, in: path, required: true, schema: { type: integer } }
        - { name: userId, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateGroupMemberBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMember"
    delete:
