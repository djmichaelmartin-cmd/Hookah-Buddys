      operationId: purchaseCredits
      tags: [credits]
      summary: Purchase interaction credits (placeholder checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPurchaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditBalance"

  /threads:
