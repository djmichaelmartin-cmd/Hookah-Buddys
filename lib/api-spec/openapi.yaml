    # ═══════════════════════════════════════════════════════════════════════════
    # Groups schemas
    # ═══════════════════════════════════════════════════════════════════════════

    GroupSummary:
      type: object
      # NOTE: `status` and `postCount` are intentionally NOT required. The
      # `getGroup` sanitized preview (private + visible non-member, or hidden
      # invited) OMITS internal/lifecycle fields, so consumers must treat them
      # as optional. All full (member/public/list) responses still populate them.
      required: [id, name, privacy, visibility, memberCount, createdAt]
      properties:
        id: { type: integer }
        name: { type: string }
        handle: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        category: { type: ["string", "null"] }
        customCategory: { type: ["string", "null"] }
        tags: { type: array, items: { type: string } }
        privacy: { type: string, enum: [public, private] }
        visibility: { type: string, enum: [visible, hidden] }
        coverUrl: { type: ["string", "null"] }
        iconUrl: { type: ["string", "null"] }
        location: { type: ["string", "null"] }
        postingPermission: { type: string }
        postApproval: { type: boolean }
        status: { type: string, enum: [active, hidden, suspended, deleted] }
        isFeatured: { type: boolean }
        memberCount: { type: integer }
        postCount: { type: integer }
        eventCount: { type: integer }
        viewerMemberRole: { type: ["string", "null"] }
        viewerHasPendingRequest: { type: boolean }
        createdAt: { type: string }
        # Meetup discriminator (group | meetup). Defaults to "group" for all existing records.
        groupType: { type: string, enum: [group, meetup] }
        # Meetup-specific interest/location metadata (null on non-meetup groups)
        meetupInterests: { type: array, items: { type: string }, nullable: true }
        meetupCity: { type: ["string", "null"] }
        meetupState: { type: ["string", "null"] }
        meetupCountry: { type: ["string", "null"] }
        # Present for radius discovery only. Calculated from server-side member
        # location and a coarse Meetup city point; raw coordinates are never public.
        distanceMiles: { type: ["number", "null"] }

    GroupDetail:
      allOf:
        - $ref: "#/components/schemas/GroupSummary"
        - type: object
          properties:
            # creatorUserId / updatedAt are present ONLY on full responses.
            # They (and postingPermission/postApproval/status/isFeatured/
            # postCount/eventCount) are OMITTED from the sanitized preview so a
            # non-member cannot learn owner identity or internal settings.
            creatorUserId: { type: integer }
            updatedAt: { type: string }
            # True when returned as a SANITIZED PREVIEW for a non-member of a
            # discoverable (private + visible, or hidden with a valid invite)
            # group. Only public discovery/request fields are included; posts,
            # members, media, and events remain behind their own membership-gated
            # endpoints and are NOT included here.
            isPreview: { type: boolean }

    GroupList:
      type: object
      required: [groups, total]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/GroupSummary"
        total: { type: integer }

    CreateGroupBody:
      type: object
      required: [name, privacy]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        handle: { type: string }
        description: { type: string }
        category: { type: string }
        customCategory: { type: string }
        tags: { type: array, items: { type: string } }
        privacy: { type: string, enum: [public, private] }
        visibility: { type: string, enum: [visible, hidden] }
        coverUrl: { type: string, description: "Finalized internal storage image object path" }
        iconUrl: { type: string, description: "Finalized internal storage image object path" }
        location: { type: string }
        postingPermission: { type: string, enum: [all_members, admins_only, approved_members] }
        postApproval: { type: boolean }
        # Meetup subtype fields (optional — omit for a regular group)
        groupType: { type: string, enum: [group, meetup] }
        meetupInterests: { type: array, items: { type: string } }
        meetupCity: { type: string }
        meetupState: { type: string }
        meetupCountry: { type: string }

    UpdateGroupBody:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        handle: { type: string }
        description: { type: string }
        category: { type: string }
        customCategory: { type: string }
        tags: { type: array, items: { type: string } }
        privacy: { type: string, enum: [public, private] }
        visibility: { type: string, enum: [visible, hidden] }
        coverUrl: { type: ["string", "null"], description: "Finalized internal storage image object; null clears" }
        iconUrl: { type: ["string", "null"], description: "Finalized internal storage image object; null clears" }
        location: { type: string }
        postingPermission: { type: string, enum: [all_members, admins_only, approved_members] }
        postApproval: { type: boolean }
        # Meetup subtype fields
        groupType: { type: string, enum: [group, meetup] }
        meetupInterests: { type: array, items: { type: string } }
        meetupCity: { type: string }
        meetupState: { type: string }
        meetupCountry: { type: string }

    JoinGroupBody:
