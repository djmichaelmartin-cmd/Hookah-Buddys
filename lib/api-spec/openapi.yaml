openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HookahBuddys platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and accounts
  - name: dolls
    description: Doll profiles and discovery
  - name: members
    description: Member profiles
  - name: media
    description: Media uploads and moderation
  - name: verification
    description: Doll verification workflow
  - name: favorites
    description: Member favorites
  - name: plans
    description: Pricing plans
  - name: lounges
    description: Hookah lounge directory and Local Lounge Spotlight
  - name: subscriptions
    description: Member and Doll subscriptions
  - name: credits
    description: Interaction credits
  - name: messages
    description: Messaging
  - name: unlocks
    description: Premium content unlocks
  - name: videochat
    description: Video chat sessions
  - name: boosts
    description: Doll profile boosts
  - name: reports
    description: Reports
  - name: profiles
    description: Enhanced social profiles and privacy
  - name: friends
    description: Friend requests, friendships, and blocks
  - name: photos
    description: Photo albums and social photos
  - name: reels
    description: Short-form reels
  - name: usertags
    description: Tagging users in content
  - name: admin
    description: Admin moderation and management
  - name: checkout
    description: Payments
  - name: contact
    description: Support
  - name: feed
    description: Public hookah social feed
  - name: follows
    description: Follow relationships
  - name: notifications
    description: User notifications
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: businesses
    description: Business Pages – hookah lounges, brands, shops, and service providers
  - name: groups
    description: Member-created Groups for HookahBuddys
paths:
  /storage/uploads/image:
    post:
      tags: [Storage]
      operationId: uploadImage
      summary: Upload an image (raw bytes, max 10 MB)
      description: |
        Bounded server-side image upload. Send the raw image bytes as the
        request body. The server enforces the size limit before storage,
        validates the bytes are a real image (JPEG, PNG, WebP, GIF, AVIF),
        and returns the stored object path.
      requestBody:
        required: true
        content:
          'image/*':
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Image stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
        '400':
          description: Body is not a valid image of an allowed type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Image exceeds the 10 MB size limit.
        '500':
          description: Failed to store image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/uploads/video:
    post:
      tags: [Storage]
      operationId: uploadVideo
      summary: Upload a video (raw bytes, max 50 MB)
      description: |
        Bounded server-side video upload. Send the raw video bytes as the
        request body. The server enforces the size limit before storage,
        validates the bytes are a real video (MP4, WebM), transcodes the
        video to a web-friendly H.264 MP4 with a JPEG poster frame, and
        returns both stored object paths.
      requestBody:
        required: true
        content:
          'video/*':
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: Video transcoded and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideoUploadResponse'
        '400':
          description: Body is not a valid video of an allowed type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: Video exceeds the 50 MB size limit.
        '500':
          description: Failed to store video.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/uploads/group-file:
    post:
      tags: [Storage]
      operationId: uploadGroupFile
      summary: Upload a Group file (raw bytes, max 15 MB)
      description: |
        Bounded server-side generic Group file upload. Send the raw file bytes
        as the request body. The server enforces the size limit before storage,
        validates the bytes are an allowed Group file type (PDF, JPEG, PNG,
        WebP), and stamps an owner ACL policy at write time. Returns the stored
        object path and the authoritative sniffed content type. Use the
        returned objectPath as the `mediaUrl` when creating a `kind: file`
        Group media item.
      requestBody:
        required: true
        content:
          'application/octet-stream':
            schema:
              type: string
              format: binary
      responses:
        '201':
          description: File stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupFileUploadResponse'
        '400':
          description: Body is not an allowed Group file type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: File exceeds the 15 MB size limit.
        '500':
          description: Failed to store file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register/doll:
    post:
      operationId: registerDoll
      tags: [auth]
      summary: Register a Doll application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DollRegistration"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/register/member:
    post:
      operationId: registerMember
      tags: [auth]
      summary: Register a Member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRegistration"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current session user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /dolls:
    get:
      operationId: listDolls
      tags: [dolls]
      summary: Browse and search Dolls
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: city, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: flavor, in: query, required: false, schema: { type: string } }
        - { name: experience, in: query, required: false, schema: { type: string } }
        - { name: verified, in: query, required: false, schema: { type: boolean } }
        - { name: featured, in: query, required: false, schema: { type: boolean } }
        - { name: online, in: query, required: false, schema: { type: boolean } }
        - { name: videoChat, in: query, required: false, schema: { type: boolean } }
        - { name: premium, in: query, required: false, schema: { type: boolean } }
        - { name: minAge, in: query, required: false, schema: { type: integer } }
        - { name: maxAge, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doll"

  /dolls/featured:
    get:
      operationId: listFeaturedDolls
      tags: [dolls]
      summary: Featured Dolls for the homepage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doll"

  /dolls/{id}:
    get:
      operationId: getDoll
      tags: [dolls]
      summary: Get a Doll profile with media
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DollDetail"

  /dolls/me/profile:
    get:
      operationId: getMyDollProfile
      tags: [dolls]
      summary: Get the signed-in Doll's own profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DollDetail"
    patch:
      operationId: updateMyDollProfile
      tags: [dolls]
      summary: Update the signed-in Doll's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DollProfileUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DollDetail"

  /dolls/me/analytics:
    get:
      operationId: getMyDollAnalytics
      tags: [dolls]
      summary: Analytics for the signed-in Doll
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DollAnalytics"

  /media:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload a media item (Doll only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"

  /media/mine:
    get:
      operationId: listMyMedia
      tags: [media]
      summary: Media uploaded by the signed-in Doll
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Media"

  /media/pending:
    get:
      operationId: listPendingMedia
      tags: [media]
      summary: Media awaiting moderation (Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Media"

  /media/{id}/moderate:
    patch:
      operationId: moderateMedia
      tags: [media]
      summary: Approve or reject a media item (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"

  /verification:
    post:
      operationId: submitVerification
      tags: [verification]
      summary: Submit verification materials (Doll)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSubmission"
    get:
      operationId: getMyVerification
      tags: [verification]
      summary: Get the signed-in Doll's verification status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSubmission"

  /verification/pending:
    get:
      operationId: listPendingVerifications
      tags: [verification]
      summary: Verification submissions awaiting review (Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerificationSubmission"

  /verification/{id}/review:
    patch:
      operationId: reviewVerification
      tags: [verification]
      summary: Approve or reject a verification submission (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSubmission"

  /favorites:
    get:
      operationId: listFavorites
      tags: [favorites]
      summary: Member's favorite Dolls
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Favorite"
    post:
      operationId: addFavorite
      tags: [favorites]
      summary: Favorite a Doll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorite"

  /favorites/{dollId}:
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: Remove a favorite
      parameters:
        - { name: dollId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List pricing plans
      parameters:
        - { name: audience, in: query, required: false, schema: { type: string, enum: [member, doll] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /lounges:
    get:
      operationId: listLounges
      tags: [lounges]
      summary: Search hookah lounges across the United States
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: lat, in: query, required: false, schema: { type: number } }
        - { name: lng, in: query, required: false, schema: { type: number } }
        - { name: radius, in: query, required: false, schema: { type: number } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lounge"

  /lounge-spotlight/local:
    get:
      operationId: getLocalLoungeSpotlight
      tags: [lounges]
      summary: Today's best local lounges for the signed-in member
      description: >
        Session-aware Local Lounge Spotlight. The origin is derived entirely
        from the session (private saved location, or the member's city/state
        fallback) — no lat/lng/city override query params are accepted. The
        response and its cards never contain coordinates, the coarse location
        key, or any user coordinates.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoungeSpotlightResponse"

  /lounge-spotlight/location:
    put:
      operationId: saveLoungeSpotlightLocation
      tags: [lounges]
      summary: Save the signed-in member's private device location
      description: >
        Persist the authenticated member's SERVER-PRIVATE device location used
        to power the Local Lounge Spotlight. Location is provided ONLY in the
        JSON request body (never as query params), so it never becomes part of
        any cache key or URL. Requires authentication. The response NEVER echoes
        coordinates or the timezone — it returns only { saved: true }.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveLoungeSpotlightLocationInput"
      responses:
        "200":
          description: Location saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveLoungeSpotlightLocationResponse"
        "400":
          description: Invalid coordinates or timezone
        "401":
          description: Authentication required

  /events:
    get:
      operationId: listEvents
      tags: [events]
      summary: Upcoming hookah events (native + Meetup-projected)
      description: >
        Returns native events and public Meetup group events merged and sorted by
        startsAt. Optional filters narrow the combined result. Existing callers
        with no filters are unaffected.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
        - { name: filter, in: query, required: false, schema: { type: string, enum: [going, saved] } }
        - { name: scope, in: query, required: false, schema: { type: string, enum: [upcoming, past] } }
        - { name: city, in: query, required: false, schema: { type: string }, description: "Filter by city (case-insensitive substring)" }
        - { name: state, in: query, required: false, schema: { type: string }, description: "Filter by 2-letter state code" }
        - { name: eventFormat, in: query, required: false, schema: { type: string, enum: [in_person, online, hybrid] }, description: "Meetup-projected events only" }
        - { name: eventCategory, in: query, required: false, schema: { type: string }, description: "Meetup-projected events only" }
        - { name: topic, in: query, required: false, schema: { type: string }, description: "Meetup-projected events only — matches any topic in the topics array" }
        - { name: sourceType, in: query, required: false, schema: { type: string, enum: [native, meetup] }, description: "Limit to native events or Meetup projections" }
        - { name: priceType, in: query, required: false, schema: { type: string, enum: [free, paid] }, description: "Meetup-projected events only" }
        - { name: startsAfter, in: query, required: false, schema: { type: string }, description: "ISO-8601 datetime — only events starting after this time" }
        - { name: startsBefore, in: query, required: false, schema: { type: string }, description: "ISO-8601 datetime — only events starting before this time" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /events/{id}:
    get:
      operationId: getEvent
      tags: [events]
      summary: A single active event with full details
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: Not found

  /events/{id}/rsvp:
    post:
      operationId: toggleEventRsvp
      tags: [events]
      summary: Toggle the current user's RSVP for an event
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRsvpResult"

  /events/{id}/save:
    post:
      operationId: toggleEventSave
      tags: [events]
      summary: Toggle the current user's save for an event
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventSaveResult"

  /admin/events:
    get:
      operationId: listAdminEvents
      tags: [admin]
      summary: All events for admin management
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
    post:
      operationId: createAdminEvent
      tags: [admin]
      summary: Create an event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEventCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"

  /admin/events/{id}:
    patch:
      operationId: updateAdminEvent
      tags: [admin]
      summary: Update an event
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminEventUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
    delete:
      operationId: deleteAdminEvent
      tags: [admin]
      summary: Delete an event
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: Current user's subscriptions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Subscribe to a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /credit-packages:
    get:
      operationId: listCreditPackages
      tags: [credits]
      summary: Available credit packages for purchase (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditPackage"

  /credits:
    get:
      operationId: getCredits
      tags: [credits]
      summary: Member credit balance and transactions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditBalance"

  /credits/purchase:
    post:
