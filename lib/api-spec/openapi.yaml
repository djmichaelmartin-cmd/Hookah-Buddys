      operationId: listThreads
      tags: [messages]
      summary: Message threads for the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageThread"
    post:
      operationId: createThread
      tags: [messages]
      summary: Start a thread (member with a Doll, or Doll with a member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThread"

  /threads/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: Messages in a thread
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a thread (uses a credit for members)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /unlocks:
    get:
      operationId: listUnlocks
      tags: [unlocks]
      summary: Member's unlocked content
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentUnlock"
    post:
      operationId: unlockContent
      tags: [unlocks]
      summary: Unlock a premium media item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentUnlock"

  /video-chats:
    get:
      operationId: listVideoChats
      tags: [videochat]
      summary: Video chat sessions for the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoChatSession"
    post:
      operationId: requestVideoChat
      tags: [videochat]
      summary: Request or schedule a video chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoChatInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoChatSession"

  /video-chats/estimate:
    get:
      operationId: estimateVideoChat
      tags: [videochat]
      summary: Estimate the credit cost of a video chat
      parameters:
        - { name: minutes, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoChatEstimate"

  /video-chats/{id}/token:
    post:
      operationId: videoChatToken
      tags: [videochat]
      summary: Issue a Twilio Video access token for a session room
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoChatToken"

  /boosts:
    get:
      operationId: listBoosts
      tags: [boosts]
      summary: Boost purchases for the signed-in Doll
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoostPurchase"
    post:
      operationId: purchaseBoost
      tags: [boosts]
      summary: Purchase a profile boost (Doll)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoostPurchase"

