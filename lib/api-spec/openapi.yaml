        recurrenceRule: { type: ["string", "null"] }
        recurrenceParentId: { type: ["integer", "null"] }
        viewerGuestCount: { type: integer }
        viewerAttendanceStatus: { type: ["string", "null"] }
        viewerWaitlistPosition: { type: ["integer", "null"] }
        viewerSaved: { type: boolean }
        # Global event projection fields (set when the event projects into /events)
        sourceType: { type: ["string", "null"], description: "meetup_event when projected" }
        sourceId: { type: ["integer", "null"], description: "group_event id" }
        meetupId: { type: ["integer", "null"], description: "group id" }
        meetupName: { type: ["string", "null"], description: "group name" }

    CreateGroupEventBody:
      type: object
      required: [title, startsAt]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        location: { type: string }
        onlineUrl: { type: string }
        imageUrl: { type: string, description: "Finalized internal storage image object" }
        startsAt: { type: string }
        endsAt: { type: string }
        visibility: { type: string, enum: [public, private] }
        hideAttendees: { type: boolean }
        # Meetup-enriched fields (optional)
        eventFormat: { type: string, enum: [in_person, online, hybrid] }
        venueName: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        eventCategory: { type: string }
        topics: { type: array, items: { type: string } }
        eventTags: { type: array, items: { type: string } }
        howToFind: { type: string }
        onlineUrlProtected: { type: boolean }
        attendeeLimit: { type: integer, minimum: 1 }
        waitlistEnabled: { type: boolean }
        allowGuests: { type: boolean }
        maxGuestsPerRsvp: { type: integer, minimum: 0 }
        rsvpOpensAt: { type: string }
        rsvpClosesAt: { type: string }
        isPaid: { type: boolean }
        paidMetadata: { type: object }
        recurrenceRule: { type: string }

    UpdateGroupEventBody:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }
        location: { type: string }
        onlineUrl: { type: string }
        imageUrl: { type: ["string", "null"] }
        startsAt: { type: string }
        endsAt: { type: string }
        status: { type: string, enum: [active, cancelled, completed, hidden] }
        visibility: { type: string, enum: [public, private] }
        hideAttendees: { type: boolean }
        # Meetup-enriched fields
        eventFormat: { type: string, enum: [in_person, online, hybrid] }
        venueName: { type: string }
