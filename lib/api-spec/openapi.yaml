  /meetups:
    get:
      operationId: listMeetups
      tags: [groups]
      summary: Discover Meetup groups (public and visible-private only)
      description: >
        Returns groups where groupType="meetup". Hidden private meetups are never
        surfaced in discovery — only public and visible-private meetups appear.
        Authenticated viewers also see meetups they are members of.
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: city, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: interests, in: query, required: false, schema: { type: string, description: "Comma-separated interest tags" } }
        - { name: privacy, in: query, required: false, schema: { type: string, enum: [public, private] }, description: "Limit to public or private meetups" }
        - name: radius
          in: query
          required: false
          schema: { type: integer, enum: [5, 10, 25, 50, 100] }
          description: >
            Search from the authenticated member's server-derived location and
            return only in-person meetups inside this travel radius. Results are
            sorted by approximate distance; no member or meetup coordinates are returned.
        - name: hasUpcomingEvent
          in: query
          required: false
          schema: { type: boolean }
          description: >
            When true, only return meetups that have at least one active upcoming
            event (startsAt in the future). Implemented as a subquery; may be
            slower on large datasets — use with a reasonable limit.
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [newest, most_members, most_active] }
          description: >
            Sort order. newest = createdAt DESC, most_members = memberCount DESC
            (default), most_active = eventCount DESC. Featured meetups always
            float to the top regardless of sort.
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupList"
        "422":
          description: The member has no safe location available for a radius search

