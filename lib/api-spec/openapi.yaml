components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string }

    User:
      type: object
      required: [id, role, email, name, accountStatus]
      properties:
        id: { type: integer }
        role: { type: string, enum: [doll, member, admin] }
        email: { type: string }
        name: { type: string }
        accountStatus: { type: string, enum: [active, pending, suspended, banned] }
        dollId: { type: ["integer", "null"] }
        createdAt: { type: string }

    MemberProfile:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        username: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        profilePhotoUrl: { type: ["string", "null"] }
        memberSince: { type: string }

    CurrentUser:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        user:
          oneOf:
            - $ref: "#/components/schemas/User"
            - type: "null"

    AuthResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/User" }

    DollRegistration:
      type: object
      required:
        - legalName
        - stageName
        - email
        - password
        - city
        - state
        - bio
        - favoriteFlavor
        - experienceLevel
        - ageConfirmed
        - rulesAccepted
      properties:
        legalName: { type: string, minLength: 1 }
        stageName: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        password: { type: string, minLength: 6 }
        phone: { type: string }
        city: { type: string, minLength: 1 }
        state: { type: string, minLength: 1 }
        age: { type: integer }
        bio: { type: string }
        favoriteFlavor: { type: string }
        experienceLevel: { type: string }
        preferences: { type: string }
        profilePhotoUrl: { type: string }
        verificationPhotoUrl: { type: string }
        verificationVideoUrl: { type: string }
        governmentIdUrl: { type: string }
        ageConfirmed: { type: boolean }
        rulesAccepted: { type: boolean }

    MemberRegistration:
      type: object
      required:
        - name
        - email
        - username
        - password
        - ageConfirmed
        - rulesAccepted
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, minLength: 3 }
        phone: { type: string }
        city: { type: string }
        state: { type: string }
        username: { type: string, minLength: 1 }
        password: { type: string, minLength: 6 }
        profilePhotoUrl: { type: string }
        ageConfirmed: { type: boolean }
        rulesAccepted: { type: boolean }

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }

    Doll:
      type: object
      required:
        - id
        - stageName
        - city
        - state
        - verified
        - featured
        - elite
        - online
        - tier
      properties:
        id: { type: integer }
        stageName: { type: string }
        city: { type: string }
        state: { type: string }
        age: { type: ["integer", "null"] }
        bio: { type: string }
        favoriteFlavor: { type: string }
        experienceLevel: { type: string }
        preferences: { type: string }
        profilePhotoUrl: { type: string }
        verified: { type: boolean }
        featured: { type: boolean }
        elite: { type: boolean }
        online: { type: boolean }
        availableForVideoChat: { type: boolean }
        tier: { type: string, enum: [free, premium, featured, elite] }
        premiumPhotoCount: { type: integer }
        premiumVideoCount: { type: integer }
        freePhotoCount: { type: integer }
        shortVideoCount: { type: integer }
        favoriteCount: { type: integer }
        subscriptionPrice: { type: number }
        messagePrice: { type: number }
        videoChatRate: { type: number }
        createdAt: { type: string }

    DollDetail:
      allOf:
        - $ref: "#/components/schemas/Doll"
        - type: object
          properties:
            verificationStatus: { type: string, enum: [unverified, pending, approved, rejected] }
            isFavorited: { type: boolean }
            viewerSubscribed: { type: boolean }
            media:
              type: array
              items:
                $ref: "#/components/schemas/Media"

    DollProfileUpdate:
      type: object
      properties:
        stageName: { type: string }
        city: { type: string }
        state: { type: string }
        bio: { type: string }
        favoriteFlavor: { type: string }
        experienceLevel: { type: string }
        preferences: { type: string }
        profilePhotoUrl: { type: string }
        online: { type: boolean }
        availableForVideoChat: { type: boolean }
        subscriptionPrice: { type: number }
        messagePrice: { type: number }
        videoChatRate: { type: number }

    DollAnalytics:
      type: object
      required: [profileViews, favorites, contentUnlocks, messageRevenue, videoChatRevenue, subscriptionRevenue]
      properties:
        profileViews: { type: integer }
        favorites: { type: integer }
        contentUnlocks: { type: integer }
        messageRevenue: { type: number }
        videoChatRevenue: { type: number }
        subscriptionRevenue: { type: number }
        totalEarnings: { type: number }
        pendingPayout: { type: number }
        viewsTrend:
          type: array
          items: { $ref: "#/components/schemas/RevenuePoint" }
        earningsTrend:
          type: array
          items: { $ref: "#/components/schemas/RevenuePoint" }

    Media:
      type: object
      required: [id, dollId, type, status, containsHookah, premium]
      properties:
        id: { type: integer }
        dollId: { type: integer }
        type: { type: string, enum: [profile, free_photo, premium_photo, premium_video, short_video, verification] }
        url: { type: string }
        thumbnailUrl: { type: string }
        caption: { type: string }
        status: { type: string, enum: [pending_review, approved, rejected] }
        containsHookah: { type: boolean }
        premium: { type: boolean }
        price: { type: number }
        tier: { type: string, enum: [photo, bundle, video, exclusive] }
        unlockCost: { type: integer }
        locked: { type: boolean }
        moderationNotes: { type: ["string", "null"] }
        dollName: { type: string }
        createdAt: { type: string }

    MediaInput:
      type: object
      required: [type, url, containsHookah]
      properties:
        type: { type: string, enum: [profile, free_photo, premium_photo, premium_video, short_video, verification] }
        url: { type: string, minLength: 1 }
        thumbnailUrl: { type: string }
        caption: { type: string }
        premium: { type: boolean }
        price: { type: number }
        tier: { type: string, enum: [photo, bundle, video, exclusive] }
        containsHookah: { type: boolean }

    ModerationInput:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        notes: { type: string }

    VerificationSubmission:
      type: object
      required: [id, dollId, status]
      properties:
        id: { type: integer }
        dollId: { type: integer }
        dollName: { type: string }
        governmentIdUrl: { type: string }
        selfieUrl: { type: string }
        hookahPhotoUrl: { type: string }
        hookahVideoUrl: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string }

    VerificationInput:
      type: object
      required: [governmentIdUrl, selfieUrl, hookahPhotoUrl, hookahVideoUrl]
      properties:
        governmentIdUrl: { type: string, minLength: 1 }
        selfieUrl: { type: string, minLength: 1 }
        hookahPhotoUrl: { type: string, minLength: 1 }
        hookahVideoUrl: { type: string, minLength: 1 }

    Favorite:
      type: object
      required: [id, dollId]
      properties:
        id: { type: integer }
        dollId: { type: integer }
        doll: { $ref: "#/components/schemas/Doll" }
        createdAt: { type: string }

    FavoriteInput:
      type: object
      required: [dollId]
      properties:
        dollId: { type: integer }

    Plan:
      type: object
      required: [id, name, audience, price, tier, monthlyCredits]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        stripePriceId: { type: string }
        audience: { type: string, enum: [member, doll] }
        price: { type: number }
        interval: { type: string }
        tier: { type: string }
        description: { type: string }
        features:
          type: array
          items: { type: string }
        highlighted: { type: boolean }
        monthlyCredits: { type: integer }

    PlanUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
        features:
          type: array
          items: { type: string, minLength: 1 }

    Event:
      type: object
      required: [id, title, city, state, startsAt, status, rsvpCount, rsvped, saved]
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: ["string", "null"] }
        loungeId: { type: ["integer", "null"] }
        venueName: { type: ["string", "null"] }
        city: { type: string }
        state: { type: string }
        startsAt: { type: string }
        endsAt: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        status: { type: string, enum: [active, cancelled] }
        rsvpCount: { type: integer }
        rsvped: { type: boolean }
        saved: { type: boolean }
        attendees:
          type: array
          description: Preview of RSVP'd members (detail route only)
          items:
            $ref: "#/components/schemas/EventAttendee"
        attendeeCount:
          type: integer
          description: Total visible attendees under the same eligibility filters as the preview (detail route only)
        # Meetup-projected events carry source attribution fields
        sourceType: { type: ["string", "null"], description: "meetup_event when projected from a Meetup group" }
        sourceId: { type: ["integer", "null"], description: "group_event.id (original source record)" }
        meetupId: { type: ["integer", "null"], description: "groups.id (Meetup group)" }
        meetupName: { type: ["string", "null"], description: "Meetup group name" }
        # Additional Meetup-projected fields (null on native events, never includes protected onlineUrl)
        eventFormat: { type: ["string", "null"], description: "in_person | online | hybrid (meetup projected only)" }
        eventCategory: { type: ["string", "null"], description: "Meetup event category" }
        topics:
          type: array
          nullable: true
          items: { type: string }
          description: "Meetup event topics"
        eventTags:
          type: array
          nullable: true
          items: { type: string }
          description: "Meetup event tags"
        isPaid: { type: ["boolean", "null"], description: "True when event requires payment (meetup projected only)" }
        paidMetadata: { type: ["object", "null"], description: "Provider-neutral payment metadata (meetup projected only)" }
        attendeeLimit: { type: ["integer", "null"], description: "Capacity cap (meetup projected only)" }
        waitlistEnabled: { type: ["boolean", "null"], description: "Whether waitlist is active (meetup projected only)" }
        waitlistCount: { type: ["integer", "null"], description: "Current waitlist size (meetup projected only)" }
        viewerWaitlistPosition: { type: ["integer", "null"], description: "Authenticated viewer's waitlist position when waitlisted" }

    EventAttendee:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        profilePhotoUrl: { type: ["string", "null"] }

    EventRsvpResult:
      type: object
      required: [rsvped, rsvpCount]
      properties:
        rsvped: { type: boolean }
        rsvpCount: { type: integer }
        rsvpStatus: { type: ["string", "null"], description: "Authoritative post-mutation RSVP status for projected Meetup Events" }
        waitlisted: { type: boolean, description: "Whether the viewer is now waitlisted for a projected Meetup Event" }
        waitlistPosition: { type: ["integer", "null"], description: "The viewer's current projected Meetup Event waitlist position" }

    EventSaveResult:
      type: object
      required: [saved]
      properties:
        saved: { type: boolean }

    AdminEventCreate:
      type: object
      required: [title, city, state, startsAt]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 2000 }
        loungeId: { type: ["integer", "null"] }
        venueName: { type: string, maxLength: 200 }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, minLength: 2, maxLength: 2 }
        startsAt: { type: string }
        endsAt: { type: ["string", "null"] }
        imageUrl: { type: string }

    AdminEventUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: ["string", "null"] }
        loungeId: { type: ["integer", "null"] }
        venueName: { type: ["string", "null"] }
        city: { type: string, minLength: 1, maxLength: 100 }
        state: { type: string, minLength: 2, maxLength: 2 }
        startsAt: { type: string }
        endsAt: { type: ["string", "null"] }
        imageUrl: { type: ["string", "null"] }
        status: { type: string, enum: [active, cancelled] }

    Lounge:
      type: object
      required: [id, name, city, state, lat, lng]
      properties:
        id: { type: integer }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        state: { type: string }
        zip: { type: string }
        lat: { type: number }
        lng: { type: number }
        phone: { type: string }
        website: { type: string }
        description: { type: string }
        rating: { type: number }
        priceLevel: { type: integer }
        hours: { type: string }
        imageUrl: { type: string }
        distanceMiles: { type: number }

    Subscription:
      type: object
      required: [id, status, monthlyCredits]
      properties:
        id: { type: integer }
        planId: { type: integer }
        planName: { type: string }
        audience: { type: string }
        dollId: { type: ["integer", "null"] }
        dollName: { type: ["string", "null"] }
        price: { type: number }
        monthlyCredits: { type: integer }
        status: { type: string, enum: [active, canceled] }
        startedAt: { type: string }
        currentPeriodEnd: { type: ["string", "null"] }

    SubscriptionInput:
      type: object
      required: [planId]
      properties:
        planId: { type: integer }
        dollId: { type: integer }

    CreditBalance:
      type: object
      required: [balance, membershipBalance, purchasedBalance, monthlyMembershipCredits]
      properties:
        balance: { type: integer }
        membershipBalance: { type: integer }
        purchasedBalance: { type: integer }
        monthlyMembershipCredits: { type: integer }
        nextRefreshAt: { type: ["string", "null"] }
        membershipPlanName: { type: ["string", "null"] }
        transactions:
          type: array
          items: { $ref: "#/components/schemas/CreditTransaction" }

    CreditTransaction:
      type: object
      required: [id, amount, type]
      properties:
        id: { type: integer }
        amount: { type: integer }
