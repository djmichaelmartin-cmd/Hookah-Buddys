        rsvpCount: { type: integer }
        hideAttendees: { type: boolean }
        viewerRsvpStatus: { type: ["string", "null"] }
        createdAt: { type: string }
        updatedAt: { type: string }
        # Meetup-enriched fields (null on non-meetup group events)
        eventFormat: { type: ["string", "null"], description: "in_person | online | hybrid" }
        venueName: { type: ["string", "null"] }
        address: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        eventCategory: { type: ["string", "null"] }
        topics: { type: array, items: { type: string }, nullable: true }
        eventTags: { type: array, items: { type: string }, nullable: true }
        howToFind: { type: ["string", "null"] }
        onlineUrlProtected: { type: boolean }
        attendeeLimit: { type: ["integer", "null"] }
        waitlistEnabled: { type: boolean }
        waitlistCount: { type: integer }
        allowGuests: { type: boolean }
        maxGuestsPerRsvp: { type: ["integer", "null"] }
        rsvpOpensAt: { type: ["string", "null"] }
        rsvpClosesAt: { type: ["string", "null"] }
