        status: { type: string }
        isPublished: { type: boolean }
        createdAt: { type: string }

    AdminBusinessSummary:
      description: >
        Admin list view: the public business summary augmented with Local Lounge
        Spotlight diagnostics. Only surfaced to platform admins.
      allOf:
        - $ref: "#/components/schemas/BusinessSummary"
        - type: object
          required:
            [
              eligibleForLoungeSpotlight,
              hasUsableSpotlightLocation,
              hasUsableSpotlightRating,
              spotlightWeightedRating,
            ]
          properties:
            eligibleForLoungeSpotlight: { type: boolean }
            hasUsableSpotlightLocation: { type: boolean }
            hasUsableSpotlightRating: { type: boolean }
            spotlightWeightedRating: { type: number }

    LoungeSpotlightCard:
      description: >
        Narrow, privacy-safe spotlight card. Never contains owner ids, user
        coordinates, exact origin, or a raw location key.
      type: object
      required:
        [
          id,
          handle,
          name,
          businessType,
          distanceMiles,
          reviewCount,
          weightedRating,
          verified,
          featured,
          followed,
        ]
      properties:
        id: { type: integer }
        handle: { type: string }
        name: { type: string }
        logoUrl: { type: ["string", "null"] }
        coverUrl: { type: ["string", "null"] }
        businessType: { type: string }
        category: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        tagline: { type: ["string", "null"] }
        distanceMiles: { type: number }
        averageRating: { type: ["number", "null"] }
        reviewCount: { type: integer }
        weightedRating: { type: number }
        verified: { type: boolean }
        featured: { type: boolean }
        openNow: { type: ["boolean", "null"] }
        followed:
          type: boolean
          description: >
            Whether the authenticated viewer already follows this Business Page.
            Viewer-specific; false when not followed. Never exposes any user id.
        legacyLoungeId:
          type: ["integer", "null"]
          description: >
            The legacy lounges.id of the SAME physical venue as this Business
            Page, when there is exactly one unambiguous cross-source match
            (normalized name+city+state and public coordinates within a tight
            threshold). Null when there is no match or the match is ambiguous.
            Lets clients suppress a duplicate legacy directory entry safely.
            Derived from public business coordinates only — never member
            coordinates — and does not affect ranking or caching.

    LoungeSpotlightResponse:
      type: object
      required: [date, radiusMiles, state, message, businesses]
      properties:
        date: { type: string }
        radiusMiles: { type: number }
        locationLabel: { type: ["string", "null"] }
        state:
          type: string
          enum: [login_required, location_required, ready, partial, empty]
        message: { type: string }
        businesses:
          type: array
          items:
            $ref: "#/components/schemas/LoungeSpotlightCard"

