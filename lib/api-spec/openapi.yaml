        businessHandle: { type: ["string", "null"] }
        businessLogoUrl: { type: ["string", "null"] }
        text: { type: string }
        mediaUrl: { type: ["string", "null"] }
        posterUrl: { type: ["string", "null"] }
        mediaType: { type: string, enum: [none, image, video] }
        postType: { type: string }
        pollData: { type: ["object", "null"] }
        status: { type: string, enum: [active, pending_approval, hidden, removed] }
        moderationLocked: { type: boolean }
        isPinned: { type: boolean }
        likeCount: { type: integer }
        commentCount: { type: integer }
        saveCount: { type: integer }
        viewerReaction: { type: ["string", "null"] }
        viewerSaved: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }

    CreateGroupPostBody:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        mediaUrl: { type: string, description: "Finalized internal storage object" }
        posterUrl: { type: string, description: "Finalized internal storage image for video poster" }
        mediaType: { type: string, enum: [none, image, video] }
        postType: { type: string, enum: [text, photo, video, poll, question, feeling, reel, file] }
        businessId: { type: integer, description: "Post as a Business Page the user manages" }
        pollData:
          type: object
          properties:
            question: { type: string }
            options:
              type: array
              items:
                type: object
                required: [id, text]
                properties:
                  id: { type: string }
                  text: { type: string }
            closesAt: { type: string }
            multiChoice: { type: boolean }

    UpdateGroupPostBody:
      type: object
