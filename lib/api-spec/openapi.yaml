  /dolls/{id}:
    get:
      operationId: getDoll
      tags: [dolls]
      summary: Get a Doll profile with media
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DollDetail"

  /dolls/me/profile:
    get:
      operationId: getMyDollProfile
      tags: [dolls]
      summary: Get the signed-in Doll's own profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DollDetail"
    patch:
      operationId: updateMyDollProfile
      tags: [dolls]
      summary: Update the signed-in Doll's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DollProfileUpdate"
      responses:
        "200":
          description: OK
