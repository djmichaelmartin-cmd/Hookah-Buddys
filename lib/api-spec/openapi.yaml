      operationId: addFavorite
      tags: [favorites]
      summary: Favorite a Doll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorite"

  /favorites/{dollId}:
