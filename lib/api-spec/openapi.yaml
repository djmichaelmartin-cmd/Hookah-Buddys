        businessId: { type: ["integer", "null"] }
        businessName: { type: ["string", "null"] }
        postId: { type: ["integer", "null"] }
        kind: { type: string, enum: [photo, video, reel, file] }
        caption: { type: ["string", "null"] }
        mediaUrl: { type: string }
        posterUrl: { type: ["string", "null"] }
        fileName: { type: ["string", "null"] }
        mimeType: { type: ["string", "null"] }
        fileSizeBytes: { type: ["integer", "null"] }
