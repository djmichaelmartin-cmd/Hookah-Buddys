        howToFind: { type: string }
        onlineUrlProtected: { type: boolean }
        attendeeLimit: { type: ["integer", "null"] }
        waitlistEnabled: { type: boolean }
        allowGuests: { type: boolean }
        maxGuestsPerRsvp: { type: ["integer", "null"] }
        rsvpOpensAt: { type: ["string", "null"] }
        rsvpClosesAt: { type: ["string", "null"] }
        isPaid: { type: boolean }
        paidMetadata: { type: ["object", "null"] }
        recurrenceRule: { type: ["string", "null"] }

    GroupEventRsvpInput:
      type: object
      required: [rsvpStatus]
      properties:
        # Waitlisting is an automatic, capacity-driven outcome — never a member/
        # public intent. Members may only express going/interested/not_going/
        # cancelled. Organizer-driven waitlisting uses set_waitlisted on the
        # separate attendee-management endpoint.
        rsvpStatus: { type: string, enum: [going, interested, not_going, cancelled] }
        isPrivate: { type: boolean }
        guestCount: { type: integer, minimum: 0 }

    GroupEventRsvpResult:
      type: object
      required: [rsvpStatus, rsvpCount]
      properties:
        rsvpStatus: { type: ["string", "null"] }
        rsvpCount: { type: integer }
        waitlisted: { type: boolean }
        waitlistPosition: { type: ["integer", "null"] }

