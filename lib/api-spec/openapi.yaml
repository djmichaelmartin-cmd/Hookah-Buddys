openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: HookahDolls platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and accounts
  - name: dolls
    description: Doll profiles and discovery
  - name: members
    description: Member profiles
  - name: media
    description: Media uploads and moderation
  - name: verification
    description: Doll verification workflow
  - name: favorites
    description: Member favorites
  - name: plans
    description: Pricing plans
  - name: subscriptions
    description: Member and Doll subscriptions
  - name: credits
    description: Interaction credits
  - name: messages
    description: Messaging
  - name: unlocks
    description: Premium content unlocks
  - name: videochat
    description: Video chat sessions
  - name: boosts
    description: Doll profile boosts
  - name: reports
    description: Reports
  - name: admin
    description: Admin moderation and management
  - name: checkout
    description: Payments
  - name: contact
    description: Support
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register/doll:
    post:
      operationId: registerDoll
      tags: [auth]
      summary: Register a Doll application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DollRegistration"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/register/member:
    post:
      operationId: registerMember
      tags: [auth]
      summary: Register a Member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberRegistration"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current session user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"

  /dolls:
    get:
      operationId: listDolls
      tags: [dolls]
      summary: Browse and search Dolls
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: city, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: flavor, in: query, required: false, schema: { type: string } }
        - { name: experience, in: query, required: false, schema: { type: string } }
        - { name: verified, in: query, required: false, schema: { type: boolean } }
        - { name: featured, in: query, required: false, schema: { type: boolean } }
        - { name: online, in: query, required: false, schema: { type: boolean } }
        - { name: videoChat, in: query, required: false, schema: { type: boolean } }
        - { name: premium, in: query, required: false, schema: { type: boolean } }
        - { name: minAge, in: query, required: false, schema: { type: integer } }
        - { name: maxAge, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doll"

  /dolls/featured:
    get:
      operationId: listFeaturedDolls
      tags: [dolls]
      summary: Featured Dolls for the homepage
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Doll"

  /dolls/{id}:
    get:
      operationId: getDoll
      tags: [dolls]
      summary: Get a Doll profile with media
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DollDetail"

  /dolls/me/profile:
    get:
      operationId: getMyDollProfile
      tags: [dolls]
      summary: Get the signed-in Doll's own profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DollDetail"
    patch:
      operationId: updateMyDollProfile
      tags: [dolls]
      summary: Update the signed-in Doll's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DollProfileUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DollDetail"

  /dolls/me/analytics:
    get:
      operationId: getMyDollAnalytics
      tags: [dolls]
      summary: Analytics for the signed-in Doll
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DollAnalytics"

  /media:
    post:
      operationId: uploadMedia
      tags: [media]
      summary: Upload a media item (Doll only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"

  /media/mine:
    get:
      operationId: listMyMedia
      tags: [media]
      summary: Media uploaded by the signed-in Doll
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Media"

  /media/pending:
    get:
      operationId: listPendingMedia
      tags: [media]
      summary: Media awaiting moderation (Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Media"

  /media/{id}/moderate:
    patch:
      operationId: moderateMedia
      tags: [media]
      summary: Approve or reject a media item (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Media"

  /verification:
    post:
      operationId: submitVerification
      tags: [verification]
      summary: Submit verification materials (Doll)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerificationInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSubmission"
    get:
      operationId: getMyVerification
      tags: [verification]
      summary: Get the signed-in Doll's verification status
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSubmission"

  /verification/pending:
    get:
      operationId: listPendingVerifications
      tags: [verification]
      summary: Verification submissions awaiting review (Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VerificationSubmission"

  /verification/{id}/review:
    patch:
      operationId: reviewVerification
      tags: [verification]
      summary: Approve or reject a verification submission (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationSubmission"

  /favorites:
    get:
      operationId: listFavorites
      tags: [favorites]
      summary: Member's favorite Dolls
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Favorite"
    post:
      operationId: addFavorite
      tags: [favorites]
      summary: Favorite a Doll
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FavoriteInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Favorite"

  /favorites/{dollId}:
    delete:
      operationId: removeFavorite
      tags: [favorites]
      summary: Remove a favorite
      parameters:
        - { name: dollId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /plans:
    get:
      operationId: listPlans
      tags: [plans]
      summary: List pricing plans
      parameters:
        - { name: audience, in: query, required: false, schema: { type: string, enum: [member, doll] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plan"

  /lounges:
    get:
      operationId: listLounges
      tags: [lounges]
      summary: Search hookah lounges across the United States
      parameters:
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: lat, in: query, required: false, schema: { type: number } }
        - { name: lng, in: query, required: false, schema: { type: number } }
        - { name: radius, in: query, required: false, schema: { type: number } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lounge"

  /subscriptions:
    get:
      operationId: listSubscriptions
      tags: [subscriptions]
      summary: Current user's subscriptions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      operationId: createSubscription
      tags: [subscriptions]
      summary: Subscribe to a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"

  /credit-packages:
    get:
      operationId: listCreditPackages
      tags: [credits]
      summary: Available credit packages for purchase (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditPackage"

  /credits:
    get:
      operationId: getCredits
      tags: [credits]
      summary: Member credit balance and transactions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditBalance"

  /credits/purchase:
    post:
      operationId: purchaseCredits
      tags: [credits]
      summary: Purchase interaction credits (placeholder checkout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPurchaseInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditBalance"

  /threads:
    get:
      operationId: listThreads
      tags: [messages]
      summary: Message threads for the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageThread"
    post:
      operationId: createThread
      tags: [messages]
      summary: Start a thread (member with a Doll, or Doll with a member)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThreadInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageThread"

  /threads/{id}/messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: Messages in a thread
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a message in a thread (uses a credit for members)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /unlocks:
    get:
      operationId: listUnlocks
      tags: [unlocks]
      summary: Member's unlocked content
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContentUnlock"
    post:
      operationId: unlockContent
      tags: [unlocks]
      summary: Unlock a premium media item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnlockInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentUnlock"

  /video-chats:
    get:
      operationId: listVideoChats
      tags: [videochat]
      summary: Video chat sessions for the current user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VideoChatSession"
    post:
      operationId: requestVideoChat
      tags: [videochat]
      summary: Request or schedule a video chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoChatInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoChatSession"

  /video-chats/estimate:
    get:
      operationId: estimateVideoChat
      tags: [videochat]
      summary: Estimate the credit cost of a video chat
      parameters:
        - { name: minutes, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoChatEstimate"

  /boosts:
    get:
      operationId: listBoosts
      tags: [boosts]
      summary: Boost purchases for the signed-in Doll
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BoostPurchase"
    post:
      operationId: purchaseBoost
      tags: [boosts]
      summary: Purchase a profile boost (Doll)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BoostInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BoostPurchase"

  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: Reported content and users (Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: Report content or a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Admin dashboard summary metrics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/applications:
    get:
      operationId: listDollApplications
      tags: [admin]
      summary: Pending Doll applications (Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DollApplication"

  /admin/applications/{id}/review:
    patch:
      operationId: reviewDollApplication
      tags: [admin]
      summary: Approve or reject a Doll application (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerationInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DollApplication"

  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: Manage users (Admin)
      parameters:
        - { name: role, in: query, required: false, schema: { type: string, enum: [doll, member, admin] } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}/status:
    patch:
      operationId: updateUserStatus
      tags: [admin]
      summary: Suspend, ban, or reactivate a user (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"

  /admin/credit-packages:
    get:
      operationId: listAdminCreditPackages
      tags: [admin]
      summary: All credit packages including inactive (Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CreditPackage"

  /admin/credit-packages/{id}:
    patch:
      operationId: updateCreditPackage
      tags: [admin]
      summary: Update a credit package (Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditPackageUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditPackage"

  /admin/credit-transactions:
    get:
      operationId: listAdminCreditTransactions
      tags: [admin]
      summary: Recent credit transactions across all members (Admin)
      parameters:
        - { name: userId, in: query, required: false, schema: { type: integer } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [purchase, spend, adjustment, membership, expiry] } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreditTransactionPage"

  /admin/credit-adjustments:
    post:
      operationId: createCreditAdjustment
      tags: [admin]
      summary: Manually grant or deduct member credits (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreditAdjustmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCreditTransaction"

  /admin/leads:
    get:
      operationId: listBusinessLeads
      tags: [admin]
      summary: List collected hookah business leads with filters (Admin)
      parameters:
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: city, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [confirmed, likely, needs_manual, closed] } }
        - { name: minConfidence, in: query, required: false, schema: { type: integer } }
        - { name: q, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessLeadPage"

  /admin/leads/summary:
    get:
      operationId: getLeadsSummary
      tags: [admin]
      summary: Summary counts for collected leads (Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadsSummary"

  /admin/leads/rejected:
    get:
      operationId: listRejectedLeads
      tags: [admin]
      summary: Rejected / duplicate records from collection (Admin)
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer } }
        - { name: offset, in: query, required: false, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RejectedLeadPage"

  /admin/leads/collect:
    get:
      operationId: getCollectStatus
      tags: [admin]
      summary: Status of the most recent collection run (Admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectStatus"
    post:
      operationId: startCollect
      tags: [admin]
      summary: Start a background collection run for a market (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectInput"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectStatus"

  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Create a checkout session (Stripe-ready placeholder)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"

  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit a support request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: Browse/search all members (Doll/Admin only)
      parameters:
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: city, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberProfile"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  /members/{id}:
    get:
      operationId: getMemberProfile
      tags: [members]
      summary: Get a member's public profile (Doll/Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberProfile"
        "404":
          description: Not found

